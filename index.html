<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Af Sparfvén — Lyxchoklad</title>
    <link rel="stylesheet" href="styles.css?v=38">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Montserrat:wght@200;300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">

    <!-- Model Viewer for 3D Model -->
    <script type="module" src="https://unpkg.com/@google/model-viewer@3.3.0/dist/model-viewer.min.js"></script>
</head>
<body>
    <!-- 3D Sparrow King Mascot -->
    <div id="sparrow-container">
        <model-viewer
            id="sparrow-model"
            src="sparvkungen.glb"
            alt="Sparvkungen Mascot"
            camera-orbit="0deg 75deg 2.5m"
            style="width: 100%; height: 100%;"
            exposure="1.2"
            shadow-intensity="0">
        </model-viewer>
    </div>

    <!-- Loading Screen -->
    <div class="loading-screen">
        <div class="loading-content">
            <img src="kugghjul.webp" alt="Laddar" class="loading-spinner">
            <p class="loading-text">Laddar...</p>
            <div class="keyhole-container" style="display: none;">
                <img src="biljett.webp" alt="Klicka för att börja" class="keyhole-image">
                <p class="keyhole-text">Välkommen till dina drömmar</p>
            </div>
        </div>
    </div>

    <!-- Intro Video -->
    <div class="intro-video-container" style="display: none;">
        <video class="intro-video" autoplay muted playsinline>
            <source src="intro_choc.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Main Hero -->
    <section class="hero">
        <div class="scroll-indicator">↓</div>
    </section>

    <!-- Interactive Chocolate Section -->
    <section class="chocolate-interactive-section">
        <h2 class="chocolate-section-title">SÄSONGENS SMAKER</h2>
        <img src="choklad_bakgrund.webp" alt="Choklad bakgrund" class="chocolate-background">

        <img src="choklad_1_stängd.webp" alt="Choklad 1" class="chocolate-piece" id="chocolate-1" data-state="closed">
        <img src="choklad_2_stängd.webp" alt="Choklad 2" class="chocolate-piece" id="chocolate-2" data-state="closed">
        <img src="choklad_3_stängd.webp" alt="Choklad 3" class="chocolate-piece" id="chocolate-3" data-state="closed">

        <!-- Clickable zones for each chocolate -->
        <div class="chocolate-zone" data-chocolate="chocolate-1" style="left: 0%; width: 33%;"></div>
        <div class="chocolate-zone" data-chocolate="chocolate-2" style="left: 33%; width: 34%;"></div>
        <div class="chocolate-zone" data-chocolate="chocolate-3" style="left: 67%; width: 33%;"></div>
    </section>

    <!-- Tid Section (Historien) -->
    <section class="tid-section">
        <img src="tid_bg.webp" alt="" class="tid-bg">
        <img src="tid_1.webp" alt="" class="tid-layer" data-title="Ädelt ursprung" data-text="Af Sparfvén är ett chokladmärke med anor. Allt började 3000 år före Kraxus när gammelfarbror Sparv-Noa byggde en jättestor båt för att rädda alla varelser på jorden undan en fruktansvärd störtflod skickad av Braxen-kungen.">
        <img src="tid_2.webp" alt="" class="tid-layer" data-title="En skänk från ovan" data-text="När Sparv-Noa släppt av alla andra djur seglade han vidare in i Amazonas mörka djungel i jakt på ett gudomligt tecken. Snart upptäckte han att floden blev tjockare och mörkare. Sparv-Noa smakade på den och märkte att det var det godaste som någonsin funnits. Han insåg att Sparv-Kungen just hade uppfunnit choklad och med det givit honom det efterlängtade tecknet: 'Här skall du bygga din chokladfabrik!'">
        <img src="tid_3.webp" alt="" class="tid-layer" data-title="Ett sparviskt urverk" data-text="Sparvarna gick så samman och uppförde Af Sparfvéns Chokladfabrik mitt i den kakaotäta djungeln och började tillverka choklad som snart var berömd över hela världen.">
        <img src="tid_4.webp" alt="" class="tid-layer" data-title="En gnutta galenskap" data-text="En gång om året samlas de tokigaste och mest rubbade mästerkockarna i chokladfabriken för att experimentera fram nya revolutionerande smaker. I ett kaos av fjädrar och kraxande slås idéer ihop, den ena mer dåraktig än den andra, till de storslagna underverk som kännetecknar Af Sparfvén.">
        <img src="tid_5.webp" alt="" class="tid-layer" data-title="Snille och smak" data-text="I egenskap av officiell hovleverantör till Sparv-Kungen har Af Sparfvén även svurit att all vinst av verksamheten ska gå direkt till denne. Sparv-Kungen i sin tur använder pengarna för att bekämpa Braxen-Kungen och för att gradvis uppfylla löftet att alla barn varje dag ska få choklad istället för skollunch. Som Sparv-Bert Einstein så väl formulerade det: 'Choklad är viktigare än kunskap!'">
        <div class="tid-textbox">
            <h3 class="tid-textbox-title"></h3>
            <p class="tid-textbox-content"></p>
        </div>
    </section>

    <!-- Contact -->
    <footer class="footer">
        <div class="footer-content">
            <div class="contact-info">
                <p>Alingsås • Sverige</p>
                <p>info@afsparfven.se</p>
            </div>
            <div class="copyright">© 2026 Af Sparfvén</div>
        </div>
    </footer>

    <script src="script.js?v=43"></script>
</body>
</html>
