<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Golden gradient -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4e4c1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8941e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Key shape -->
  <g filter="url(#glow)">
    <!-- Key bow (top circle) -->
    <circle cx="8" cy="8" r="5" fill="url(#goldGradient)" stroke="#b8941e" stroke-width="1"/>
    <circle cx="8" cy="8" r="2.5" fill="none" stroke="#b8941e" stroke-width="1"/>

    <!-- Key shaft -->
    <rect x="7" y="12" width="2" height="14" fill="url(#goldGradient)" stroke="#b8941e" stroke-width="0.5"/>

    <!-- Key teeth -->
    <rect x="9" y="22" width="3" height="1.5" fill="url(#goldGradient)" stroke="#b8941e" stroke-width="0.5"/>
    <rect x="9" y="25" width="4" height="1.5" fill="url(#goldGradient)" stroke="#b8941e" stroke-width="0.5"/>
  </g>
</svg>
